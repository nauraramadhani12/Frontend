ents-none"><svg class="w-full h-full" preserveAspectRatio="none" viewBox="0 0 400 150"><path d="M0,70 C100,120 220,30 400,80 L400,150 L0,150 Z" fill="#a7f3d0"></path><path d="M0,100 C150,50 280,130 400,95 L400,150 L0,150 Z" fill="#6ee7b7" opacity="0.6"></path></svg></div></div><div class="relative z-10 flex-1 flex flex-col items-center justify-center -mt-6"><div class="relative flex items-center justify-center mb-6"><div class="absolute inset-0 m-auto w-40 h-40 bg-emerald-200/40 rounded-full blur-xl"></div><div class="relative w-36 h-36 rounded-full bg-white shadow-lg p-2 flex items-center justify-center ring-4 ring-emerald-50"><img alt="Dewi Sri Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAw-tYysOfVwxYMn-FcT5ti_uf5yiAsWGYB1PmvdVQ7Oxga_tnLEf_KCPvtY0xBBM_5qwNT89lpjMDNgoyE3GmJ8Aem39rn7BXuNac1JKK0HoVbOqiGaVAE6XWxcykIe3wCr757EZDUNpDj67VGd8HYzBP7E8ywqfVgZCtEGl4apV5G73jW6I2jedOjal2RFrZEgI8gunyVvWhbWIdwFzfAWc9KIYfJM1OmxKN_5sFA"></div></div><h1 class="text-3xl font-extrabold text-[#1b4d3e] tracking-tight text-center">Dewi Sri</h1><p class="text-sm text-stone-600 font-medium text-center mt-2 max-w-[260px]">Rawat ternak &amp; tanaman jadi lebih mudah</p><div class="flex items-center justify-center gap-6 mt-8"><div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-2xl shadow-sm hover:scale-110 transition-transform duration-200">🌱</div><div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center text-2xl shadow-sm hover:scale-110 transition-transform duration-200">🐟</div><div class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center text-2xl shadow-sm hover:scale-110 transition-transform duration-200">🐥</div></div></div><div class="relative z-10 w-full max-w-sm mx-auto flex flex-col items-center pb-2"><button class="w-full h-14 bg-[#0E8551] hover:bg-[#0b6e43] text-white font-extrabold text-base rounded-full shadow-md flex items-center justify-center transition-all duration-150 active:translate-y-1 active:border-b-0 border-b-4 border-[#095c37]" type="button" id="btn-start">Mulai</button><p class="text-xs text-stone-500 text-center mt-3">Masuk atau daftar untuk menyimpan peliharaanmu</p></div></div>
<script>
  (function() {
    const btnStart = document.getElementById('btn-start');
    const loadingLabel = document.getElementById('loading-label');
    const progressFill = document.getElementById('progress-fill');
    const progressPercent = document.getElementById('progress-percent');

    const funnySteps = [
      { text: "Menyiapkan kebun virtualmu...", pct: "85%" },
      { text: "Menyapa bulir padi pagi...", pct: "92%" },
      { text: "Mengisi air kolam segar...", pct: "98%" },
      { text: "Semua siap! Mari bertani!", pct: "100%" }
    ];
    let step = 0;

    const interval = setInterval(() => {
      step = (step + 1) % funnySteps.length;
      if (loadingLabel && progressFill && progressPercent) {
        loadingLabel.textContent = funnySteps[step].text;
        progressFill.style.width = funnySteps[step].pct;
        progressPercent.textContent = funnySteps[step].pct;
      }
    }, 2400);

    if (btnStart) {
      btnStart.addEventListener('click', () => {
        btnStart.classList.add('scale-95');
        setTimeout(() => {
          btnStart.classList.remove('scale-95');
          if (loadingLabel) {
            loadingLabel.textContent = "Membuka gerbang sawah Dewi Sri...";
          }
          if (progressFill && progressPercent) {
            progressFill.style.width = "100%";
            progressPercent.textContent = "100%";
          }
        }, 150);
      });
    }
  })();
</script></main>
