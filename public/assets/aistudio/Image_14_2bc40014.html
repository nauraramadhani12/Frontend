<!-- Interactive Logic -->
<script>
  let kenyang = 80;
  let kebersihan = 75;
  let bahagia = 90;

  const speeches = [
    "Kukuruyuk! Pagi yang cerah di peternakan! 🌾",
    "Nyam nyam! Jagung manis ini lezat sekali! 🌽",
    "Segar! Air bersih membuat buluku berkilau! 💧",
    "Kandangku bersih berkilau, nyaman sekali! ✨",
    "Petok petok! Terima kasih sudah menyayangiku! ❤️"
  ];

  function showFloatingSparkle(text, colorClass) {
    const target = document.getElementById('heart-target');
    if (!target) return;
    const bubble = document.createElement('div');
    bubble.className = `font-headline-sm text-sm font-extrabold transition-all duration-700 transform -translate-y-0 opacity-100 ${colorClass}`;
    bubble.innerText = text;
    target.appendChild(bubble);
    setTimeout(() => {
      bubble.style.transform = 'translateY(-24px) scale(1.2)';
      bubble.style.opacity = '0';
    }, 50);
    setTimeout(() => bubble.remove(), 750);
  }

  function updateVitals() {
    document.getElementById('label-kenyang').innerText = `${kenyang}%`;
    document.getElementById('bar-kenyang').style.width = `${kenyang}%`;

    document.getElementById('label-kebersihan').innerText = `${kebersihan}%`;
    document.getElementById('bar-kebersihan').style.width = `${kebersihan}%`;

    document.getElementById('label-bahagia').innerText = `${bahagia}%`;
    document.getElementById('bar-bahagia').style.width = `${bahagia}%`;
  }

  function setSpeech(idx) {
    const bubble = document.getElementById('speech-bubble');
    const textEl = document.getElementById('speech-text');
    bubble.style.transform = 'scale(0.95)';
    setTimeout(() => {
      textEl.innerText = speeches[idx];
      bubble.style.transform = 'scale(1)';
    }, 150);
  }

  function feedPet() {
    kenyang = Math.min(100, kenyang + 10);
    bahagia = Math.min(100, bahagia + 5);
    updateVitals();
    setSpeech(1);
    showFloatingSparkle("🌽 Kenyang!", "text-amber-600");
  }

  function waterPet() {
    bahagia = Math.min(100, bahagia + 8);
    updateVitals();
    setSpeech(2);
    showFloatingSparkle("💧 Segar!", "text-blue-600");
  }

  function cleanPet() {
    kebersihan = Math.min(100, kebersihan + 15);
    bahagia = Math.min(100, bahagia + 5);
    updateVitals();
    setSpeech(3);
    showFloatingSparkle("✨ Bersih!", "text-primary");
  }

  function petInteraction() {
    bahagia = Math.min(100, bahagia + 5);
    updateVitals();
    setSpeech(4);
    showFloatingSparkle("❤️ Senang!", "text-red-500");
  }

  function tanyaDewiAi() {
    const bubble = document.getElementById('speech-bubble');
    const textEl = document.getElementById('speech-text');
    textEl.innerText = "Si Kuning siap dengar tips pakan dari Dewi Sri!";
    bubble.classList.add('animate-bounce');
    setTimeout(() => bubble.classList.remove('animate-bounce'), 800);
  }
</script>
