<div class="flex flex-col items-center pt-2 pb-6">
<div class="relative">

</div>
<button aria-label="Ganti Foto Profil" class="absolute -bottom-1 -right-1 w-9 h-9 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-[0_3px_0_0_#00522f] active:translate-y-0.5 active:shadow-[0_1px_0_0_#00522f] transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">photo_camera</span>
</button>
</div>
<button class="mt-3 font-label-lg text-label-lg text-primary hover:text-primary-container active:scale-95 transition-transform flex items-center gap-1" type="button">

</div>
<div class="bg-surface-container-lowest rounded-lg p-5 shadow-sm space-y-5">
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1.5" for="nama-panggilan">
        Nama Panggilan
      </label>
<div class="relative flex items-center">
<input class="w-full h-[52px] rounded-DEFAULT bg-surface-container-low px-4 text-on-surface font-body-lg text-body-lg outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="nama-panggilan" placeholder="Tulis nama panggilanmu" type="text" value="Sobat Tani">
<span class="material-symbols-outlined absolute right-4 text-outline text-[20px] pointer-events-none">sentiment_satisfied</span>
</div>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1.5" for="asal-daerah">
        Asal Daerah
      </label>
<div class="relative flex items-center">
<input class="w-full h-[52px] rounded-DEFAULT bg-surface-container-low px-4 text-on-surface font-body-lg text-body-lg outline-none focus:bg-surface-container-lowest transition-colors shadow-inner" id="asal-daerah" placeholder="Contoh: Bandung, Jawa Barat" type="text">
<span class="material-symbols-outlined absolute right-4 text-outline text-[20px] pointer-events-none">location_on</span>
</div>
</div>
<div>
<label class="block font-label-lg text-label-lg text-on-surface mb-1.5" for="email-field">
        Email
      </label>
<div class="relative flex items-center opacity-80 cursor-not-allowed">
<input class="w-full h-[52px] rounded-DEFAULT bg-surface-container-low px-4 text-on-surface-variant font-body-lg text-body-lg outline-none cursor-not-allowed shadow-inner" id="email-field" readonly="" type="email" value="sobat.tani@gmail.com">
<span class="material-symbols-outlined absolute right-4 text-outline text-[20px] pointer-events-none">lock</span>
</div>
</div><div class="pt-1">
<div class="font-label-lg text-label-lg text-on-surface">Yang Ingin Dirawat</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5 mb-3">
        Pilih fokus perawatan utama kamu di Dewi Sri
      </p>
<div class="grid grid-cols-3 gap-2.5" id="care-selection">
<button class="chip-choice h-[48px] rounded-full px-2 flex items-center justify-center gap-1.5 font-label-md text-label-md bg-primary-container text-on-primary-container shadow-[0_3px_0_0_#00522f] active:translate-y-0.5 active:shadow-[0_1px_0_0_#00522f] transition-all" data-selected="true" onclick="toggleChoice(this)" type="button">
<span class="material-symbols-outlined text-[18px]">potted_plant</span>
<span class="">Tanaman</span>
</button>
<button class="chip-choice h-[48px] rounded-full px-2 flex items-center justify-center gap-1.5 font-label-md text-label-md bg-surface-container-low text-on-surface shadow-[0_3px_0_0_#bdcabe] active:translate-y-0.5 active:shadow-[0_1px_0_0_#bdcabe] transition-all" data-selected="false" onclick="toggleChoice(this)" type="button">
<span class="material-symbols-outlined text-[18px] text-tertiary">set_meal</span>
<span class="">Ikan</span>
</button>
<button class="chip-choice h-[48px] rounded-full px-2 flex items-center justify-center gap-1.5 font-label-md text-label-md bg-surface-container-low text-on-surface shadow-[0_3px_0_0_#bdcabe] active:translate-y-0.5 active:shadow-[0_1px_0_0_#bdcabe] transition-all" data-selected="false" onclick="toggleChoice(this)" type="button">
<span class="material-symbols-outlined text-[18px] text-secondary">cruelty_free</span>
<span class="">Ayam</span>
</button>
</div>
</div>
</div>

<div class="flex flex-col gap-2 pt-2">
<button class="w-full h-[52px] rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg shadow-[0_4px_0_0_#00522f] active:translate-y-1 active:shadow-[0_1px_0_0_#00522f] transition-all flex items-center justify-center gap-2" onclick="handleSave()" type="button">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
      Simpan Perubahan
    </button>
<button class="w-full py-3 text-center text-on-surface-variant font-label-md text-label-md hover:text-on-surface active:scale-95 transition-all" onclick="history.back()" type="button">
      Batal
    </button>
</div>
<div class="hidden fixed bottom-6 left-4 right-4 bg-primary-container text-on-primary-container p-4 rounded-DEFAULT shadow-lg flex items-center gap-3 transform transition-transform" id="save-toast">
<span class="material-symbols-outlined text-[24px]">task_alt</span>
<div class="flex-1">
<div class="font-label-lg text-label-lg">Tersimpan!</div>
<div class="font-body-sm text-body-sm">Profil Sobat Tani berhasil diperbarui.</div>
</div>
</div>
<script>
    function toggleChoice(btn) {
      const isSelected = btn.getAttribute('data-selected') === 'true';
      if (isSelected) {
        btn.setAttribute('data-selected', 'false');
        btn.className = 'chip-choice h-[48px] rounded-full px-2 flex items-center justify-center gap-1.5 font-label-md text-label-md bg-surface-container-low text-on-surface shadow-[0_3px_0_0_#bdcabe] active:translate-y-0.5 active:shadow-[0_1px_0_0_#bdcabe] transition-all';
      } else {
        btn.setAttribute('data-selected', 'true');
        btn.className = 'chip-choice h-[48px] rounded-full px-2 flex items-center justify-center gap-1.5 font-label-md text-label-md bg-primary-container text-on-primary-container shadow-[0_3px_0_0_#00522f] active:translate-y-0.5 active:shadow-[0_1px_0_0_#00522f] transition-all';
      }
    }

    function handleSave() {
      const toast = document.getElementById('save-toast');
      if (toast) {
        toast.classList.remove('hidden');
        setTimeout(() => {
          history.back();
        }, 800);
      }
    }
  </script>
</div></main>
